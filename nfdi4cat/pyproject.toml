[project]
name = "transaminase-kg"
version = "0.1.0"
description = "A FAIR knowledge graph of transaminase reactions: OWL ontology, RDF triplestore, and a SPARQL-over-HTTP API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Kundai Farai Sachikonye" },
]
keywords = ["catalysis", "ontology", "knowledge-graph", "rdf", "sparql", "nfdi4cat", "transaminase"]

dependencies = [
    "owlready2>=0.46",
    "rdflib>=7.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",   # SPARQL POST via form field (SPARQL 1.1 protocol)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",          # FastAPI TestClient transport
    "ruff>=0.5",
]

[project.scripts]
# Rebuild the ontology + knowledge graph artefacts from source definitions.
build-kg = "transaminase_kg.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaminase_kg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Be strict: any warning is an error, so a real regression can't hide in the
# noise. The one exception is a deprecation *inside* Starlette's TestClient
# (it imports httpx in a way it now warns about) — third-party, not ours, and
# only present under test. We silence that single message rather than mask the
# whole category.
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # rdflib raises this from its own query machinery whenever a Dataset is
    # queried with default_union=True (which we use so a Buhera enrichment fact
    # joins the base subject it enriches). Internal to rdflib, not our call.
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
]
