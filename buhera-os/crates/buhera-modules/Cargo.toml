[package]
name = "buhera-modules"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Buhera federation module adapters: thin wrappers that expose vendored engines through the buhera-registry Module contract. One cargo feature per module."

[features]
default = ["vahera", "ndombolo", "windtunnel", "tracker", "sbs-core", "heihachi", "olduvai", "levinthal", "mekaneck"]
# Pure engines (no I/O beyond what the spec declares); these also build for
# wasm32 and back the TypeScript host's in-process binding (buhera-wasm).
vahera = ["dep:buhera-vahera", "dep:buhera-kernel"]
ndombolo = ["dep:ndombolo-core"]
windtunnel = ["dep:wt-dsl"]
tracker = ["dep:tracker-chi"]
heihachi = ["dep:heihachi-lang"]
olduvai = ["dep:olduvai-core"]
levinthal = ["dep:levinthal-core"]
mekaneck = ["dep:mekaneck-lang"]
# Native-only: the engine reads std::time::Instant, which panics on wasm32.
sbs-core = ["dep:sbs"]
# Network + model providers; heavy (tokio, reqwest/rustls). Off by default.
zangalewa = ["dep:zangalewa-dsl", "dep:tokio"]
full = ["vahera", "ndombolo", "windtunnel", "tracker", "sbs-core", "heihachi", "olduvai", "levinthal", "mekaneck", "zangalewa"]

[dependencies]
buhera-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

buhera-vahera = { workspace = true, optional = true }
buhera-kernel = { workspace = true, optional = true }
ndombolo-core = { workspace = true, optional = true }
wt-dsl = { workspace = true, optional = true }
tracker-chi = { workspace = true, optional = true }
heihachi-lang = { workspace = true, optional = true }
olduvai-core = { workspace = true, optional = true }
levinthal-core = { workspace = true, optional = true }
mekaneck-lang = { workspace = true, optional = true }
sbs = { workspace = true, optional = true }
zangalewa-dsl = { workspace = true, optional = true }
tokio = { version = "1.35", features = ["rt"], optional = true }
