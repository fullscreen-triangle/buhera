# VENDORED — fullscreen-triangle/zangalewa crates/zangalewa-dsl (see
# specifications/registry/vendor.json). src/ is a byte-exact copy of upstream
# at the recorded commit; only this manifest is local. The upstream `zangalewa`
# CLI (src/bin) is not built here (autobins = false). Do not edit src/ — run
# `node scripts/vendor-sync.mjs --sync zangalewa-dsl`.
[package]
name = "zangalewa-dsl"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
description = "Vendored: Zangalewa — (dslId, instructions) -> DSL chunks that compile."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
