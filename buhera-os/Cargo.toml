# Buhera OS — standalone categorical operating system.
#
# This workspace is self-contained. It depends on nothing outside its
# own crates plus a small set of well-known third-party libraries
# (serde, regex, thiserror, clap). It is deliberately decoupled from
# `mechanistic-synthesis/`, `long-grass/`, and any other Buhera-adjacent
# project so the OS can be built and run on its own.

[workspace]
resolver = "2"
members = [
    "crates/buhera-substrate",
    "crates/buhera-kernel",
    "crates/buhera-vahera",
    "crates/buhera-embed",
    "crates/buhera-os",
    "crates/buhera-gateway",
    "crates/buhera-pair",
    "crates/buhera-registry",
    "crates/buhera-modules",
    "crates/buhera-wasm",
    # Vendored engines (byte-exact upstream sources; see specifications/06-sourcing.md).
    "vendor/wt-dsl",
    "vendor/ndombolo-core",
    "vendor/tracker-chi",
    "vendor/zangalewa-dsl",
    "vendor/hegel-sbs",
    "vendor/heihachi",
    "vendor/olduvai-core",
    "vendor/levinthal-core",
    "vendor/mekaneck/crates/algebra",
    "vendor/mekaneck/crates/lang",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kundai Farai Sachikonye <kundai.sachikonye@wzw.tum.de>"]
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/fullscreen-triangle/buhera"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# Workspace-internal crates.
buhera-substrate = { path = "crates/buhera-substrate" }
buhera-kernel    = { path = "crates/buhera-kernel" }
buhera-vahera    = { path = "crates/buhera-vahera" }
buhera-embed     = { path = "crates/buhera-embed" }
buhera-gateway   = { path = "crates/buhera-gateway" }
buhera-registry  = { path = "crates/buhera-registry" }
wt-dsl           = { path = "vendor/wt-dsl" }
ndombolo-core    = { path = "vendor/ndombolo-core" }
tracker-chi      = { path = "vendor/tracker-chi" }
zangalewa-dsl    = { path = "vendor/zangalewa-dsl" }
sbs              = { path = "vendor/hegel-sbs" }
heihachi-lang    = { path = "vendor/heihachi" }
olduvai-core     = { path = "vendor/olduvai-core" }
levinthal-core   = { path = "vendor/levinthal-core" }
mekaneck-lang    = { path = "vendor/mekaneck/crates/lang" }
buhera-modules   = { path = "crates/buhera-modules", default-features = false }

# Release packaging for `buhera-pair`, the one binary meant for end-user
# download — a machine's owner installs this, not the OS core (`buhera-os`'s
# demo/repl bins, opted out via its own `dist = false`) or the gateway
# (deployed by hand, also opted out; see buhera-gateway/DEPLOYMENT.md).
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
pr-run-mode = "plan"
# The generated ../../.github/workflows/release.yml is hand-patched to `cd
# buhera-os` (or use `working-directory:`) before every `dist` invocation,
# since this workspace lives in a subdirectory of the git repo rather than
# at its root — a layout cargo-dist has no native support for (confirmed:
# https://github.com/axodotdev/cargo-dist/issues, no `repository-root`-style
# key exists as of 0.32). Without `allow-dirty`, `dist plan`/`build`/`host`
# refuse to run at all once the checked-in workflow diverges from what a
# fresh `dist generate` would produce — which every one of those hand
# patches necessarily causes. Re-apply the patches after any `dist init` or
# `dist generate` regenerates this file from scratch.
allow-dirty = ["ci"]

# cargo-dist builds release binaries under this profile rather than
# `release` directly — inherited from it, with debug info stripped, since a
# 2MB binary a user downloads has no use for symbols the OS core's own
# `release` profile keeps for local debugging.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.release]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
opt-level = 0
debug = true
