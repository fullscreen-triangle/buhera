[package]
name = "interceptor-run"
version = "0.1.0"
edition = "2021"
description = "Sandboxed execution CLI for the long-grass interceptor module: compiles and runs a Rust snippet with a wall-clock timeout and capped output, printing one JSON result to stdout."
license = "MIT"

[[bin]]
name = "interceptor-run"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
